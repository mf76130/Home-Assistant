alias: Virtueller Akku 2 – Simulation
description: Simuliert einen zweiten 5kWh Akku zur Kaufentscheidung
triggers:
  - seconds: /30
    trigger: time_pattern
conditions: []
actions:
  - target:
      entity_id: input_number.virtual_battery_2_soc
    data:
      value: >
        {% set current = states('input_number.virtual_battery_2_soc') | float %}
        {% set grid_w = states('sensor.leistung_alle_phasen') | float %} {% set
        interval_h = 30 / 3600 %} {% set cap_max = 5000 %} {% set cap_min = 600
        %} {% set max_power_w = 2500 %}

        {% if grid_w < 0 %}
          {% set charge_w = [grid_w | abs, max_power_w] | min %}
          {% set new_soc = current + (charge_w * interval_h) %}
          {{ [new_soc, cap_max] | min | round(0) }}
        {% elif grid_w > 0 and current > cap_min %}
          {% set discharge_w = [grid_w, max_power_w] | min %}
          {% set new_soc = current - (discharge_w * interval_h) %}
          {{ [new_soc, cap_min] | max | round(0) }}
        {% else %}
          {{ current | round(0) }}
        {% endif %}
    action: input_number.set_value
mode: single
max_exceeded: silent
